# eu-stack thread-role rules (EUS-01, EUS-02).
#
# Row order IS the precedence knob (D-01): rules are tried in file order, top
# to bottom, and every frame #0..#N of a signature is scanned for the first
# rule; the first rule that matches ANYWHERE in the stack wins. There is no
# `priority` field, by design — position in this file is the only knob.
#
# Review rule for every future rule addition (verified empirically against
# the reference capture, not a guess): any rule keyed on a task-dispatch or
# pool-loop frame must sit AFTER the rules identifying that same task's
# active-work frames. A task-dispatch frame (e.g. `MSIEvaluationTask::Run`)
# can be a shared ancestor of BOTH the idle-wait call chain and the busy
# call chain for the same task, so an idle rule keyed on it placed too early
# silently reclassifies busy threads as idle. See rule 15 below for the
# concrete, shipped instance of this trap.
#
# `match` defaults to `exact` when omitted (D-09) — every `contains` below is
# therefore a deliberate, greppable choice, never an accident.
#
# Every pattern must already be written in normalise()'s canonical form: no
# `@GLIBC_...`/`@@GLIBC_...` version suffix, no ` - <lib> <src>:<line>` tail.
# The loader rejects a non-canonical pattern loudly at load time, quoting the
# canonical form to use.
#
# Lock findings are ownership-blind by construction: eu-stack carries no
# monitor-ownership edges, so contention can be observed but never attributed
# to a holder (see docs/decisions/0015-eustack-thread-role-taxonomy.md).
#
# Do NOT add a catch-all or generic ancestor-frame rule (e.g. a bare
# `MSIThread::Run`) to inflate coverage. `unclassified` is the sole residual
# and its rate is the rules-drift signal this file's curator relies on —
# driving it to zero by guessing destroys that signal.

[meta]
version = 2
validated_against = "MicroStrategy Intelligence Server (castorserver) on glibc 2.34; v1.3 reference capture, 2 dumps, 3902 threads / 93 signatures"

# Rules 1-5: running. D-02's five locked frames, placed FIRST so they win
# before any idle rule sharing an ancestor frame is ever tested (see rule 15).
[[rule]]
role = "running"
subsystem = "compute"
match = "contains"
pattern = '_shi_allocBlock'

[[rule]]
role = "running"
subsystem = "compute"
match = "contains"
pattern = '_shi_allocVar'

[[rule]]
role = "running"
subsystem = "compute"
match = "contains"
pattern = 'MemAllocPtr'

[[rule]]
role = "running"
subsystem = "cube-generation"
match = "contains"
pattern = 'CDSSSubsetEngine::GenCube'

[[rule]]
role = "running"
subsystem = "cube-generation"
match = "contains"
pattern = 'MCE::GetBaseRIbyID'

# Rule 6: blocked-on-lock. glibc reaches this symbol only on the contended
# futex slow path — the one sound single-leaf contention signal. The
# reference capture is healthy and matches it zero times; that is the
# expected result on a healthy server, not a missing rule.
[[rule]]
role = "blocked-on-lock"
subsystem = "lock"
match = "contains"
pattern = '__lll_lock_wait'

# Rules 7-15: idle-parked.
[[rule]]
role = "idle-parked"
subsystem = "job-queue"
match = "contains"
pattern = 'MSIQTask::GetNextPreferredJob'

[[rule]]
role = "idle-parked"
subsystem = "job-queue"
match = "contains"
pattern = 'MSIQTask::GetNextJob'

[[rule]]
role = "idle-parked"
subsystem = "command-queue"
match = "contains"
pattern = 'MSICommandQTask::GetNextCommand'

[[rule]]
role = "idle-parked"
subsystem = "ipc"
match = "contains"
pattern = 'CrossProcessEventImpl::WaitOnPipe'

[[rule]]
role = "idle-parked"
subsystem = "generic-pool"
match = "contains"
pattern = 'ThreadPoolImpl::GetNextRunnable'

[[rule]]
role = "idle-parked"
subsystem = "bursting-pool"
match = "contains"
pattern = 'ParallelBursting::ThreadPool::WorkLoop'

[[rule]]
role = "idle-parked"
subsystem = "asio-reactor"
match = "contains"
pattern = 'boost::asio::detail::scheduler::run'

[[rule]]
role = "idle-parked"
subsystem = "cache-backup"
match = "contains"
pattern = 'CacheBackupRunnable'

# `MSIEvaluationTask::Run` is the load-bearing ordering case: it is ALSO an
# ancestor frame in genuinely busy cube-generation call chains (five distinct
# reference-capture signatures contain it alongside a `running`-rule frame),
# not exclusively idle-associated. It must sit after rules 1-5 — with the
# running rules first, rule 1 matches those busy signatures and wins before
# this rule is ever tested. Reordering this rule above the running rules
# reclassifies 44% of the milestone's own headline population as idle.
[[rule]]
role = "idle-parked"
subsystem = "evaluation"
match = "contains"
pattern = 'MSIEvaluationTask::Run'

# Rules 16-19: blocked-on-external.
[[rule]]
role = "blocked-on-external"
subsystem = "warehouse"
match = "contains"
pattern = 'CDSSQueryEngine::WaitUntilFinished'

[[rule]]
role = "blocked-on-external"
subsystem = "http"
match = "contains"
pattern = 'curl_multi_poll'

[[rule]]
role = "blocked-on-external"
subsystem = "ipc"
match = "contains"
pattern = 'SharedMemoryImpl::WaitOnSemaphore'

[[rule]]
role = "blocked-on-external"
subsystem = "warehouse"
match = "contains"
pattern = 'MDb::Wrapper::InterpretStatus'

# Rules 20-24: idle-parked.
[[rule]]
role = "idle-parked"
subsystem = "timer"
match = "contains"
pattern = 'MTimer::Timer<'

[[rule]]
role = "idle-parked"
subsystem = "scheduled"
match = "contains"
pattern = 'MSIRecurrentTask::Run'

[[rule]]
role = "idle-parked"
subsystem = "network-reactor"
match = "contains"
pattern = 'MSINetReactorModern'

[[rule]]
role = "idle-parked"
subsystem = "kafka"
match = "contains"
pattern = 'rd_kafka_broker_thread_main'

[[rule]]
role = "idle-parked"
subsystem = "kafka"
match = "contains"
pattern = 'rd_kafka_thread_main'

# ---------------------------------------------------------------------------
# Processing-unit (PU) mapping — the SECOND, orthogonal axis (ADR 0022).
#
# A role says WHAT a thread is doing (idle-parked, blocked-on-lock, running);
# a PU says WHICH Intelligence Server work queue it is doing it FOR. The two
# are independent: a `blocked-on-lock` thread in the Query Engine PU and a
# `blocked-on-lock` thread in the Command PU are the same role and completely
# different incidents. Crossing the axes is the point — "which type of PU's
# threads are locked or slow" is only answerable with both.
#
# Provenance: the queue names and their identifying frames are recovered from
# the MicroStrategy Support Utility Notepad++ plugin v1.25 (its compiled-in
# ten-entry PUMap/signature tables, and the `taskmap` file its TaskMap::Lookup
# reads). All nine rows below were verified byte-for-byte against the shipped
# DLL and are pinned by test_pu_rules_reproduce_the_utilitys_table_verbatim —
# so a queue NAME here is spelled exactly as the utility spells it, and an
# engineer reading both tools' output never has to reconcile two spellings.
#
# Sift re-implements the CONCEPT, not the mechanism — see ADR 0022 for the
# four deliberate divergences: matching is deepest-frame-wins rather than
# lowest-PU-index-wins; `index` is provenance only and never precedence; there
# is no network taskmap, no ten-entry cap and no sentinel index; and a gdb
# thread is identified by its LWP rather than by gdb's own session-local
# counter.
#
# ADDING A QUEUE. The utility's tenth entry is the sentinel "Not Yet
# Implemented", and its own version-skew warning ("The current PUMap contains
# additional PUs that this version of the plugin cannot support") shows the
# network taskmap is expected to grow past nine. This file is where that
# growth belongs for Sift, and it has no cap. A new row needs: an `index`
# unused by any other name (use the utility's number when it has one, else the
# next free number above 8 — 9 is deliberately left empty, being the
# sentinel's position); a fully-qualified dispatch frame as `pattern`; and a
# `description` naming the work, since it is shown to the operator and to the
# model. Add a golden-case `truth.yaml` figure alongside, or the new queue
# ships ungated exactly as this whole axis nearly did.
#
# `match` defaults to `exact` (D-09), same as [[rule]]; every pattern must be
# in normalise() canonical form; duplicate (match, pattern) pairs are rejected,
# as is one name carrying two indices or one index carrying two names.
#
# ORDER IN THIS FILE IS NOT PRECEDENCE for [[pu]] rows — unlike [[rule]].
# Stack DEPTH is: the deepest matching frame wins, because a PU-identifying
# frame is a thread's dispatch ancestor and the deepest one is the queue that
# actually owns the thread. Measured on the v1.3 reference capture: three
# signatures contain both `CDSSSQLEngineServer` (a SQL helper called at frame
# #2) and `MSIEvaluationTask::Run` (the dispatch ancestor at frame #25). The
# plugin's lowest-index rule calls those threads SQL Engine; they are
# Evaluation threads that called a SQL helper. Depth is the sound rule and it
# needs no curated ordering to stay sound as rows are added.

[[pu]]
index = 0
name = "Command PU"
subsystem = "command"
match = "contains"
pattern = 'MSIDSSCommand::Process'
description = "Executing a client command"

[[pu]]
index = 1
name = "SQL Engine"
subsystem = "sql-engine"
match = "contains"
pattern = 'CDSSSQLEngineServer'
description = "SQL generation for a report or cube"

[[pu]]
index = 2
name = "Query Engine"
subsystem = "query-engine"
match = "contains"
pattern = 'CDSSQueryEngineServer'
description = "Executing SQL against the warehouse"

[[pu]]
index = 3
name = "Analytical Engine"
subsystem = "analytical-engine"
match = "contains"
pattern = 'CDSSAnalyticalEngineServer'
description = "Analytical calculation over a result set"

[[pu]]
index = 4
name = "Resolution"
subsystem = "resolution"
match = "contains"
pattern = 'DSSResolutionServerTask::Run'
description = "Resolving object definitions"

[[pu]]
index = 5
# Name verbatim from the utility's own PU table: no space before the
# parenthesis. Kept byte-exact so an engineer who knows the utility's output
# recognises the queue without a translation step.
name = "Delivery(NCSPU)"
subsystem = "delivery"
match = "contains"
pattern = 'DSSPersistResultTask::Run'
description = "Persisting or delivering a subscription result"

[[pu]]
index = 6
name = "Browsing"
subsystem = "browsing"
match = "contains"
pattern = 'DSSObjectServerTask::Run'
description = "Object browsing and metadata retrieval"

[[pu]]
index = 7
name = "Document Data Preparation"
subsystem = "document-data-prep"
match = "contains"
pattern = 'DSSDocumentDataPreparationTask::Run'
description = "Preparing datasets for a document or dossier"

[[pu]]
index = 8
name = "Evaluation"
subsystem = "evaluation"
match = "contains"
pattern = 'MSIEvaluationTask::Run'
description = "Evaluating a view, dossier or Report Services document"
