# Frozen ground truth (D-07). Do not edit this file to make a run pass — a
# regression must fail, not be silently accommodated.
#
# This is the cosmetic-mutation twin of eustack-hang-pool-warehouse (D-19-11):
# renumbered TIDs, reordered/interleaved thread blocks, and every instruction
# address changed — frame symbols stay byte-identical to the original. The
# figures below are IDENTICAL to the original's, verified by measurement, not
# copied on faith (see README.md for the measurement command).
root_cause: >
  The same synthetic warehouse connection-pool exhaustion as
  eustack-hang-pool-warehouse, cosmetically mutated: different TID range,
  interleaved thread-block order, and every instruction address changed.
  Frame symbols are byte-identical to the original.
required_evidence: []
acceptable_keywords: []
expect_no_incident: false
expect_eustack:
  provenance: authored
  hang_detected: true
  total_threads: 35
  warn: 0
  # ADR 0022: 25 of 35 threads blocked in the Query Engine = 71.4%, over the
  # 35.0 critical cut-point. This is the ONE graded figure that separates this
  # case from eustack-healthy — without it both emit an identical all-info
  # flag set, and `sift eustack`'s summary line says nothing about a total
  # warehouse stall.
  critical: 1
  info_dimensions:
    - unclassified_thread_pct
    - no_resolvable_frame_pct
  pools:
    warehouse: 25
    job-queue: 0
  dependencies:
    warehouse: 25
  # Processing-unit figures (ADR 0022), MEASURED against the committed input.
  # This is the whole point of the axis on this case: "25 threads are blocked"
  # is also true of a lock convergence, and would need a completely different
  # fix. Naming the queue AND the wait kind is what makes the finding
  # actionable, so both are pinned. lock_blocked: 0 is a real assertion — a
  # rules change that reclassified this warehouse wait as lock contention
  # would invert the diagnosis and must fail here.
  processing_units:
    Query Engine:
      total_threads: 25
      lock_blocked: 0
      dependency_blocked: 25
      idle: 0
      running: 0
  # The 10 remaining threads are idle job-queue noise that no [[pu]] rule
  # attributes, so they are the unattributed row and appear in no named queue.
  processing_unit_names:
    - Query Engine
