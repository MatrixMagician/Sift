# Frozen ground truth (D-07, mirroring eustack-healthy/truth.yaml's header):
# authored BEFORE any prompt tuning. Do not edit this file to make a run
# pass — a regression must fail, not be silently accommodated.
#
# EUS-12 (D-19-17): this case is scored by the eu-stack path
# (expect_eustack), never by the negative-hypothesis predicate
# (expect_no_incident). required_evidence and acceptable_keywords stay
# empty (D-19-06): no LLM metric is scored on this case at all.
#
# Every figure below was MEASURED by running analyse_eustack_bundle() against
# the committed input/threaddump.txt (see README.md for the exact measurement
# command and the fixture's provenance: frames observed/copied from the real
# reference capture, population authored from the documented warehouse
# connection-pool exhaustion scenario — D-19-09).
root_cause: >
  A synthetic warehouse connection-pool exhaustion: every worker in the
  warehouse pool is parked on the same CDSSQueryEngine::WaitUntilFinished
  external-wait signature, alongside a smaller population of idle-parked
  job-queue noise threads. This is an authored scenario, not an observed
  capture — see README.md for exactly which frames were copied from the real
  reference capture and what was authored.
required_evidence: []
acceptable_keywords: []
expect_no_incident: false
expect_eustack:
  provenance: authored
  hang_detected: true
  total_threads: 35
  warn: 0
  critical: 0
  info_dimensions:
    - unclassified_thread_pct
    - no_resolvable_frame_pct
  pools:
    warehouse: 25
    job-queue: 0
  dependencies:
    warehouse: 25
  # Processing-unit figures (ADR 0022), MEASURED against the committed input.
  # This is the whole point of the axis on this case: "25 threads are blocked"
  # is also true of a lock convergence, and would need a completely different
  # fix. Naming the queue AND the wait kind is what makes the finding
  # actionable, so both are pinned. lock_blocked: 0 is a real assertion — a
  # rules change that reclassified this warehouse wait as lock contention
  # would invert the diagnosis and must fail here.
  processing_units:
    Query Engine:
      total_threads: 25
      lock_blocked: 0
      dependency_blocked: 25
      idle: 0
      running: 0
  # The 10 remaining threads are idle job-queue noise that no [[pu]] rule
  # attributes, so they are the unattributed row and appear in no named queue.
  processing_unit_names:
    - Query Engine
