# Frozen ground truth (D-07, mirroring perfmon-denial/truth.yaml's header):
# authored BEFORE any prompt tuning. Do not edit this file to make a run
# pass — a regression must fail, not be silently accommodated.
#
# EUS-12 (D-19-17): this case is scored by the eu-stack path
# (expect_eustack), never by the negative-hypothesis predicate
# (expect_no_incident) — the two are different kinds of "no incident" and
# would double-count if both were set here. required_evidence and
# acceptable_keywords stay empty (D-19-06): no LLM metric is scored on this
# case at all, vacuously or otherwise.
#
# Every figure below was MEASURED by running analyse_eustack_bundle() against
# the committed input/threaddump.txt derivative (see README.md for the exact
# derivation invocation and the measurement command) — none is guessed.
root_cause: >
  A thread-proportion-faithful derivative of a real, observed, near-idle
  Intelligence Server capture: the great majority of threads are idle pool
  workers, a small minority are legitimately waiting on the warehouse and
  HTTP dependencies, and none are converging on a lock. There is no incident
  here.
required_evidence: []
acceptable_keywords: []
expect_no_incident: false
expect_eustack:
  provenance: observed
  hang_detected: false
  total_threads: 144
  warn: 0
  critical: 0
  info_dimensions:
    - unclassified_thread_pct
    - no_resolvable_frame_pct
  pools:
    job-queue: 0
    evaluation: 0
    command-queue: 0
    ipc: 0
    generic-pool: 0
    bursting-pool: 0
    cache-backup: 0
    http: 3
    warehouse: 3
    asio-reactor: 0
  dependencies:
    http: 3
    warehouse: 3
